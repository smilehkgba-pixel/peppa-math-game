<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>佩佩數學大師 DX</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --gb:#f1c40f; --gb-hi:#f6d34a; --gb-shadow:#c9a00c;
  --bg:#222; --green:#2ecc71; --red:#e74c3c; --blue:#4fc3f7;
  --ink:#111; --lcd:#f3f0dc; --panel:#2c3e50;
}
* { box-sizing:border-box; font-family:'Noto Sans TC','PingFang HK','Microsoft JhengHei','Noto Sans CJK TC',sans-serif; font-weight:700; letter-spacing:0; user-select:none; -webkit-tap-highlight-color:transparent; }
img, svg { image-rendering:pixelated; image-rendering:crisp-edges; }
body { background:var(--bg); height:100vh; height:100dvh; margin:0; padding:6px; display:flex; justify-content:center; align-items:center; overflow:hidden; }

/* Yellow DMG shell — plastic bevel, not glass */
.gameboy {
  width:100%; max-width:420px; height:98vh; height:98dvh;
  background:linear-gradient(180deg, var(--gb-hi) 0%, var(--gb) 22%, var(--gb) 100%);
  border-radius:12px 12px 46px 12px; padding:14px 14px 12px 14px;
  display:flex; flex-direction:column; position:relative;
  border:3px solid #e0b40e;
  box-shadow:
    inset 4px 4px 0 rgba(255,255,255,0.28),
    inset -5px -7px 0 rgba(0,0,0,0.14),
    0 8px 0 var(--gb-shadow),
    0 12px 16px rgba(0,0,0,0.32);
}
.gameboy::after {
  content:"GAME BOY"; font-family:'Press Start 2P',cursive; font-weight:400;
  font-size:7px; letter-spacing:0.18em; color:#5c4d10; text-align:center;
  margin-top:8px; opacity:0.72; line-height:1; flex-shrink:0;
}
.screen-bezel {
  background:linear-gradient(180deg,#4a4a4a,#2c2c2c);
  padding:12px 12px 28px 12px; border-radius:8px 8px 28px 8px;
  flex:1; min-height:0; display:flex; flex-direction:column; position:relative;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,0.14), inset -3px -3px 0 rgba(0,0,0,0.55);
}
.screen-bezel::before {
  content:""; position:absolute; left:12px; bottom:10px; width:8px; height:8px;
  background:#e74c3c; border-radius:50%;
  box-shadow:0 0 0 2px #1a1a1a, 0 0 5px #e74c3c;
}
.screen-bezel::after {
  content:""; position:absolute; right:14px; bottom:8px; width:52px; height:14px;
  background:radial-gradient(circle,#111 1.15px,transparent 1.25px);
  background-size:7px 7px; opacity:0.88;
}
.screen {
  background:var(--lcd); flex:1; min-height:0; border:3px solid #000;
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.2);
}
.screen::after {
  content:""; position:absolute; top:0; left:0; right:0; height:22%;
  pointer-events:none; z-index:12;
  background:linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0));
}
.hidden { display:none !important; }

/* === 1. Start Screen === */
#s-start { flex:1; background:linear-gradient(var(--blue) 50%, #7cfc00 50%); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:10px 8px; }
.s-clouds { position:absolute; top:16px; left:0; width:200%; height:40px; background:url('data:image/svg+xml;utf8,<svg width="100" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M10 30 Q25 10 40 30 Q55 10 70 30 Q85 10 100 30" stroke="white" fill="white" opacity="0.6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>') repeat-x; animation: c-move 30s linear infinite; z-index:1; }
.logo { font-size:18px; text-align:center; color:#fff; text-shadow:2px 2px 0 #000; line-height:1.45; margin-bottom:10px; z-index:13; }
.peppa-start { width:120px; height:120px; animation:bounce 0.8s infinite steps(2); margin-bottom:10px; z-index:13; }
.start-menu { text-align:center; width:100%; z-index:13; display:flex; flex-direction:column; align-items:center; gap:0; }
.start-count { font-size:14px; margin-bottom:8px; color:#111; text-shadow:0 1px 0 rgba(255,255,255,0.35); }
.menu-btn {
  background:#fff; border:3px solid #000; padding:14px 12px; width:86%;
  min-height:48px; text-align:center; margin:8px auto 0 auto; cursor:pointer;
  font-size:17px; line-height:1.3; box-shadow:4px 4px 0 #000; color:var(--ink);
  z-index:2; display:flex; align-items:center; justify-content:center;
}
.menu-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
.mb-play { background:#219150; color:#fff; text-shadow:1px 1px 0 #000; }
.mb-dex { background:#1a6aa3; color:#fff; text-shadow:1px 1px 0 #000; }

/* === 2. Topic Select === */
#s-diff { flex:1; min-height:0; background:var(--panel); padding:10px 12px 8px; display:flex; flex-direction:column; align-items:center; overflow:hidden; }
.diff-scroll { width:100%; flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; justify-content:safe center; padding:2px 0 6px; }
#s-diff > .menu-btn { flex-shrink:0; width:100%; margin-top:6px; }
.diff-title { color:#fff; font-size:18px; margin:0 0 10px; text-align:center; text-shadow:2px 2px 0 #000; line-height:1.4; }
.diff-btn {
  width:100%; padding:12px 10px; margin-bottom:8px; border:3px solid #000;
  cursor:pointer; font-size:18px; color:var(--ink); text-align:center;
  position:relative; box-shadow:4px 4px 0 #000; line-height:1.3; min-height:56px;
}
.diff-btn:active { transform:translate(2px,2px); box-shadow:none; }
.zh, .diff-sub {
  font-family:'Noto Sans TC','Noto Sans CJK TC','PingFang HK','Microsoft JhengHei','Source Han Sans TC',sans-serif;
  font-weight:700; letter-spacing:0; font-style:normal;
}
.diff-sub { display:block; font-size:13px; margin-top:4px; line-height:1.3; color:inherit; opacity:0.95; }
.d-easy { background:#1e8e4f; color:#fff; text-shadow:1px 1px 0 #000; }
.d-hard { background:#c0392b; color:#fff; text-shadow:1px 1px 0 #000; animation:border-pulse 2s infinite; }
.d-div { background:#1a6aa3; color:#fff; text-shadow:1px 1px 0 #000; }
.d-frac { background:#7b3fa0; color:#fff; text-shadow:1px 1px 0 #000; }
@keyframes border-pulse { 0% {box-shadow:4px 4px 0 #000;} 50% {box-shadow:4px 4px 0 #ffff00;} 100% {box-shadow:4px 4px 0 #000;} }

/* === 3. Battle Scene === */
#s-battle { flex:1; min-height:0; display:flex; flex-direction:column; }
.view { height:48%; background:linear-gradient(var(--blue) 60%, #a8e6cf 60%); position:relative; border-bottom:3px solid #000; overflow:hidden; flex-shrink:0; }
.bg-sun { position:absolute; top:10px; right:20px; width:40px; height:40px; background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6" fill="%23fff700"/><path d="M10 0v4M10 16v4M0 10h4M16 10h4M3 3l3 3M14 14l3 3M3 17l3-3M14 6l3-3" stroke="%23fff700" stroke-width="2"/></svg>') no-repeat; z-index:0; }
.bg-hills { position:absolute; bottom:38%; width:200%; height:60px; background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60"><path d="M0 60 C 30 20, 70 20, 100 60 C 130 30, 170 30, 200 60 Z" fill="%232ecc71"/><rect x="60" y="10" width="20" height="30" fill="%23f1c40f"/><path d="M55 10 L85 10 L70 0 Z" fill="%23e74c3c"/></svg>') repeat-x; animation: c-move 40s linear infinite; z-index:1; opacity:0.9; }
.bg-ground { position:absolute; bottom:0; width:100%; height:40%; background:#70e070; border-top: 3px solid #5ec25e; z-index:2; }

.hud { position:absolute; background:#fff; border:3px solid #000; padding:5px 7px; border-radius:4px; font-size:13px; color:var(--ink); z-index:14; }
.hud-e { top:8px; left:8px; } .hud-p { bottom:25px; right:8px; text-align:right; }
.hbar { width:64px; height:6px; border:1px solid #000; margin-top:3px; background:#ddd; }
.hfill { height:100%; background:var(--green); transition:width 0.3s; }
.pos-e { position:absolute; top:20px; right:5px; width:170px; height:170px; animation:float 2s infinite ease-in-out; z-index:5; }
.pos-p { position:absolute; bottom:5px; left:10px; width:110px; height:110px; z-index:5; }

.ctrl { flex:1; background:var(--panel); border-top:3px solid #ffcc00; padding:8px; display:flex; flex-direction:column; gap:6px; min-height:0; }
.msg { background:#fff; border:3px solid #000; padding:8px 10px; font-size:15px; min-height:44px; max-height:58px; margin-bottom:0; color:var(--ink); line-height:1.4; overflow:hidden; }
.msg .zh { font-size:15px; line-height:1.4; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1 1 auto; min-height:108px; max-height:168px; }
.b-btn {
  background:#fff; border:3px solid #000; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-family:'Noto Sans TC','Press Start 2P',sans-serif; font-weight:800;
  cursor:pointer; color:var(--ink); box-shadow:0 3px 0 #000;
  padding:8px 6px; min-height:48px; line-height:1.15; text-align:center;
}
.b-btn.zh-btn { font-size:18px; padding:8px 8px; }
.b-btn:active { transform:translateY(3px); box-shadow:none; }
.btn-correct { background:#219150 !important; color:#fff !important; border-color:#000 !important; text-shadow:1px 1px 0 #000; }
.btn-wrong { background:#c0392b !important; color:#fff !important; border-color:#000 !important; text-shadow:1px 1px 0 #000; }
.catch { background:#c0392b; color:#fff; border-color:#000; text-shadow:1px 1px 0 #000; animation:pulse 1s infinite; min-height:52px; font-size:18px; }

/* === Dex & Detail === */
#s-dex { flex:1; min-height:0; background:var(--red); display:flex; flex-direction:column; padding:8px; position:relative; overflow:hidden; }
.dex-head { display:flex; justify-content:space-between; align-items:center; border-bottom:4px solid #000; margin-bottom:8px; padding-bottom:8px; flex-shrink:0; gap:8px; }
.dex-title { color:#fff; font-size:16px; text-shadow:1px 1px 0 #000; }
.awards-chip {
  font-size:14px; background:var(--gb); color:var(--ink); padding:8px 10px;
  border:3px solid #000; cursor:pointer; min-height:40px; box-shadow:2px 2px 0 #000;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.awards-chip:active { transform:translate(2px,2px); box-shadow:none; }
.d-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; overflow-y:auto; flex:1 1 auto; min-height:0; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
.dex-foot { flex-shrink:0; width:100%; min-height:48px; margin:8px 0 0 0; }
.slot { background:#fff; border:2px solid #000; text-align:center; padding:6px 4px; filter:grayscale(1) brightness(0.7); cursor:default; }
.slot .nm { font-size:12px; margin-top:3px; line-height:1.3; color:var(--ink); }
.slot.got { filter:grayscale(0) brightness(1); border-color:#d4a017; cursor:pointer; transition:transform 0.1s; }
.slot.got:active { transform:scale(0.95); }

#dex-detail { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-y:auto; padding:12px; }
#dd-name { color:#fff; font-size:20px; margin-bottom:16px; letter-spacing:0; text-shadow: 2px 2px 0 #000; flex-shrink:0; }
#dd-img { width:180px; height:180px; max-height:40%; object-fit:contain; image-rendering:pixelated; margin-bottom:16px; animation: bounce 0.6s infinite alternate; filter: drop-shadow(0 0 10px #fff); }
#dex-detail > .menu-btn { flex-shrink:0; }

#awards-menu { position:absolute; top:0; left:0; width:100%; height:100%; background:var(--panel); z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
.aw-btn { width:100%; margin-bottom:10px; padding:14px 12px; min-height:52px; font-size:16px; border:3px solid #fff; color:#fff; cursor:pointer; text-align:center; background:#555; line-height:1.4; flex-shrink:0; }
.aw-btn.unlocked { background:#f1c40f; color:#000; border-color:#000; animation: pulse 1s infinite; }
#awards-menu > .menu-btn { flex-shrink:0; width:100%; margin-top:6px; }

.award-screen { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; text-align:center; overflow:hidden; }
#s-award-9 { background: #3498db; }
#s-award-12 { background: linear-gradient(135deg, #f1c40f, #e67e22); }
.award-img { width: 90%; max-width: 300px; max-height: 42%; object-fit: contain; border: 4px solid #000; box-shadow: 5px 5px 0 rgba(0,0,0,0.3); margin-bottom: 16px; animation: pop-up 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
.award-title { font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; flex-shrink:0; }
.award-copy { flex-shrink:0; }
.award-screen > .menu-btn { flex-shrink:0; }

#l-ball { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99; display:flex; flex-direction:column; justify-content:center; align-items:center; }
#flash { position:absolute; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; opacity:0; pointer-events:none; }
#c-display { width:180px; height:180px; display:none; z-index:102; filter:drop-shadow(0 0 10px gold); }

.q-text { font-size: 16px; color: #fff; text-shadow: 2px 2px 0 #000; margin-bottom: 2px; text-align: center; line-height:1.4; font-family:'Noto Sans TC','Press Start 2P',sans-serif; font-weight:800; }
.q-text .zh { font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:16px; letter-spacing:0; text-shadow:1px 1px 0 #000; }
.q-text.q-visual { font-size:12px; }
.q-text.q-visual .zh { font-size:15px; }
.frac-pizza { width:92px; height:92px; display:block; margin:4px auto 2px auto; }
.frac-bar { display:flex; width:200px; max-width:92%; height:36px; margin:8px auto 4px auto; border:3px solid #000; background:#fff; }
.frac-cell { flex:1; background:#fff6d5; border-right:3px solid #000; }
.frac-cell:last-child { border-right:none; }
.frac-cell.on { background:#e74c3c; }
.frac-blocks { display:flex; gap:4px; justify-content:center; margin:8px auto 4px auto; flex-wrap:wrap; }
.frac-block { width:26px; height:26px; border:3px solid #000; background:#fff6d5; }
.frac-block.on { background:#3498db; }
.anim-correct { color: #2ecc71; animation: bounce-text 0.3s; text-shadow: 2px 2px 0 #000; }
.anim-wrong { color: #e74c3c; animation: shake-text 0.3s; text-shadow: 2px 2px 0 #000; }

@keyframes bounce-text { 0%, 100% {transform: scale(1);} 50% {transform: scale(1.3);} }
@keyframes shake-text { 0% {transform: translateX(0);} 25% {transform: translateX(5px);} 75% {transform: translateX(-5px);} 100% {transform: translateX(0);} }
@keyframes c-move{from{background-position:0 0}to{background-position:-200px 0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}}
.dmg{animation:shake 0.4s;filter:brightness(2) sepia(1) hue-rotate(-50deg) saturate(5);} @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.atk{animation:lunge 0.3s forwards;} @keyframes lunge{0%{transform:translateX(0)}50%{transform:translateX(20px) translateY(-5px)}100%{transform:translateX(0)}}
.b-throw{animation:throw 0.5s forwards;} @keyframes throw{0%{transform:translateY(200px) scale(0.5)}100%{transform:translateY(0) scale(1)}}
.b-open{animation:open 0.5s forwards;} @keyframes open{50%{transform:scale(1.2)}100%{transform:scale(0);opacity:0}}
.s-flash{animation:flash 0.5s;} @keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
.b-shake{animation:shake-ball 0.5s 3;} @keyframes shake-ball{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.pop-up{display:block !important; animation:pop 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);} @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1.5)}}
.happy-jump{animation:h-jump 0.5s infinite;} @keyframes h-jump{0%,100%{transform:scale(1.5) translateY(0)}50%{transform:scale(1.5) translateY(-10px)}}
</style>
</head>
<body>
<div class="gameboy"><div class="screen-bezel"><div class="screen">

<div id="s-start">
    <div class="s-clouds"></div>
    <div class="logo">佩佩 vs 寶可夢<br><span style="color:#ffff00;font-size:14px;">數學大師 DX</span></div>
    <svg class="peppa-start" viewBox="0 0 20 22" shape-rendering="crispEdges"><rect x="5" y="1" width="2" height="3" fill="#ffb7b2"/><rect x="5" y="1" width="2" height="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="11" y="1" width="2" height="3" fill="#ffb7b2"/><rect x="11" y="1" width="2" height="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="3" y="4" width="12" height="9" fill="#ffb7b2"/><rect x="3" y="4" width="12" height="9" fill="none" stroke="#000" stroke-width="0.5"/><rect x="15" y="6" width="4" height="4" fill="#ffb7b2"/><rect x="15" y="6" width="4" height="4" fill="none" stroke="#000" stroke-width="0.5"/><rect x="17" y="7" width="1" height="2" fill="#d48c94"/><rect x="6" y="6" width="2" height="2" fill="#fff"/><rect x="7" y="7" width="1" height="1" fill="#000"/><rect x="10" y="6" width="2" height="2" fill="#fff"/><rect x="11" y="7" width="1" height="1" fill="#000"/><rect x="5" y="9" width="3" height="3" fill="#ff8da1" opacity="0.7"/><path d="M4 13 h10 l2 6 h-14 z" fill="#e74c3c"/><path d="M4 13 h10 l2 6 h-14 z" fill="none" stroke="#000" stroke-width="0.5"/><rect x="1" y="15" width="3" height="1" fill="#ffb7b2"/><rect x="1" y="15" width="3" height="1" fill="none" stroke="#000" stroke-width="0.5"/><rect x="16" y="15" width="3" height="1" fill="#ffb7b2"/><rect x="16" y="15" width="3" height="1" fill="none" stroke="#000" stroke-width="0.5"/><rect x="6" y="19" width="2" height="2" fill="#ffb7b2"/><rect x="6" y="19" width="2" height="2" fill="none" stroke="#000" stroke-width="0.5"/><rect x="12" y="19" width="2" height="2" fill="#ffb7b2"/><rect x="12" y="19" width="2" height="2" fill="none" stroke="#000" stroke-width="0.5"/><rect x="5" y="21" width="4" height="1" fill="#000"/><rect x="11" y="21" width="4" height="1" fill="#000"/></svg>
    <div class="start-menu">
        <div class="start-count">圖鑑：<span id="d-cnt">0/27</span></div>
        <div class="menu-btn mb-play" onclick="showDiff()">🌱 開始遊戲</div>
        <div class="menu-btn mb-dex" onclick="dex()">📖 精靈圖鑑</div>
    </div>
</div>

<div id="s-diff" class="hidden">
    <div class="diff-scroll">
        <div class="diff-title">揀課題</div>
        <div class="diff-btn d-easy" onclick="battle('easy')">乘法（簡易）<span class="diff-sub">九因歌 0–10</span></div>
        <div class="diff-btn d-hard" onclick="battle('hard')">乘法（困難）<span class="diff-sub">複合加減 · 神獸出沒</span></div>
        <div class="diff-btn d-div" onclick="battle('div')">除法<span class="diff-sub">整除 · 餘數 · 因數</span></div>
        <div class="diff-btn d-frac" onclick="battle('frac')">分數<span class="diff-sub">陰影 · 加減 · 比較</span></div>
    </div>
    <div class="menu-btn" onclick="home()">返回</div>
</div>

<div id="s-battle" class="hidden">
    <div class="view">
        <div class="bg-sun"></div><div class="bg-hills"></div><div class="bg-ground"></div>
        <div class="hud hud-e"><div id="e-name">?</div><div class="hbar"><div class="hfill" id="e-hp"></div></div></div>
        <img id="e-img" class="pos-e" src="">
        <svg class="pos-p" viewBox="0 0 20 22" shape-rendering="crispEdges"><rect x="5" y="1" width="2" height="3" fill="#ffb7b2"/><rect x="5" y="1" width="2" height="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="13" y="1" width="2" height="3" fill="#ffb7b2"/><rect x="13" y="1" width="2" height="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="3" y="4" width="14" height="9" fill="#ffb7b2"/><rect x="3" y="4" width="14" height="9" fill="none" stroke="#000" stroke-width="0.5"/><path d="M4 13 h12 l2 6 h-16 z" fill="#e74c3c"/><path d="M4 13 h12 l2 6 h-16 z" fill="none" stroke="#000" stroke-width="0.5"/><path d="M16 16 c1 0 2 1 2 2 s-1 2-2 2" fill="none" stroke="#ff8da1" stroke-width="1.5" stroke-linecap="round"/></svg>
        <div class="hud hud-p"><div>佩佩</div><div class="hbar"><div class="hfill" id="p-hp"></div></div></div>
    </div>
    <div class="ctrl">
        <div class="msg" id="msg">...</div>
        <div id="q-area" class="q-text"></div>

<script>
const SPR="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";
const pkm=(id,n,h)=>({id,n,i:SPR+id+".png",h});
const DB=[
    // Ordinary (Easy mode)
    pkm(1,"妙蛙種子",false),
    pkm(4,"小火龍",false),
    pkm(7,"傑尼龜",false),
    pkm(10,"綠毛蟲",false),
    pkm(16,"波波",false),
    pkm(25,"皮卡丘",false),
    pkm(35,"皮皮",false),
    pkm(37,"六尾",false),
    pkm(39,"胖丁",false),
    pkm(43,"走路草",false),
    pkm(52,"喵喵",false),
    pkm(54,"可達鴨",false),
    pkm(58,"卡蒂狗",false),
    pkm(66,"腕力",false),
    pkm(104,"卡拉卡拉",false),
    pkm(129,"鯉魚王",false),
    pkm(133,"伊布",false),
    pkm(143,"卡比獸",false),
    pkm(175,"波克比",false),

    pkm(249,"洛奇亞",true),
    pkm(250,"鳳王",true)
];

const SAVE_KEY="peppa-math-progress";
let my=[], c={m:null,eh:150,ph:100,a:0,cap:false,diff:'easy',lock:false}, timer=null;
let awarded9 = false;

function ordinaryTotal(){return DB.filter(p=>!p.h).length;}
function ordinaryCaught(){return my.filter(id=>{const p=DB.find(x=>x.id===id);return p&&!p.h;}).length;}
function allOrdinaryCaught(){return ordinaryTotal()>0&&ordinaryCaught()===ordinaryTotal();}
function allCaught(){return DB.length>0&&DB.every(p=>my.includes(p.id));}
function updateDexCount(){document.getElementById('d-cnt').innerText=`${my.length}/${DB.length}`;}
function loadProgress(){
    try{
        const raw=localStorage.getItem(SAVE_KEY);
        if(!raw) return;
        const data=JSON.parse(raw);
        if(Array.isArray(data.my)){
            const valid=new Set(DB.map(p=>p.id));
            my=data.my.filter(id=>valid.has(id));
        }
        if(typeof data.awarded9==="boolean") awarded9=data.awarded9;
    }catch(e){}
}
function saveProgress(){
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({my,awarded9}));}catch(e){}
}
function init(){
    loadProgress();
    document.getElementById('aw9-n').innerText=ordinaryTotal();
    document.getElementById('aw12-n').innerText=DB.length;
    updateDexCount();
    rd();
}
function show(id){document.querySelectorAll('.screen>div').forEach(d=>d.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function home(){show('s-start');} 
function showDiff(){show('s-diff');}
function dex(){rd();show('s-dex');}

function showDetail(id) {
    let p = DB.find(x => x.id === id);
    document.getElementById('dd-name').innerText = p.n;
    document.getElementById('dd-img').src = p.i;
    document.getElementById('dex-detail').classList.remove('hidden');
}
function closeDetail() { document.getElementById('dex-detail').classList.add('hidden'); }

function openAwards() {
    let b9 = document.getElementById('btn-aw-9');
    let b12 = document.getElementById('btn-aw-12');
    
    if(allOrdinaryCaught()) { b9.innerHTML="普通精靈獎<br>（睇獎狀）"; b9.classList.add('unlocked'); }
    else { b9.innerHTML="普通精靈獎<br>（未解鎖）"; b9.classList.remove('unlocked'); }
    
    if(allCaught()) { b12.innerHTML="數學大師獎<br>（睇獎狀）"; b12.classList.add('unlocked'); }
    else { b12.innerHTML="數學大師獎<br>（未解鎖）"; b12.classList.remove('unlocked'); }
    
    document.getElementById('awards-menu').classList.remove('hidden');
}
function closeAwards() { document.getElementById('awards-menu').classList.add('hidden'); }

function showAward(type) {
    if(type===9 && allOrdinaryCaught()) show('s-award-9');
    if(type===12 && allCaught()) show('s-award-12');
}
function backToDex() { show('s-dex'); }

function encounterPool(mode){
    const uncollectedIds = DB.map(p=>p.id).filter(id => !my.includes(id));
    const uncollectedLeg = DB.filter(p => p.h && uncollectedIds.includes(p.id));
    const uncollectedNorm = DB.filter(p => !p.h && uncollectedIds.includes(p.id));
    const norms = uncollectedNorm.length > 0 ? uncollectedNorm : DB.filter(p => !p.h);
    // Hard multiply: still the legendary hunt.
    // Division / Fractions: P3 challenge modes — 35% legendary if any remain uncaught.
    if (mode === 'hard') {
        return uncollectedLeg.length > 0 ? uncollectedLeg : DB;
    }
    if ((mode === 'div' || mode === 'frac') && uncollectedLeg.length > 0 && Math.random() < 0.35) {
        return uncollectedLeg;
    }
    return norms;
}

function battle(diff){
    if(timer) clearTimeout(timer);
    c = { m:null, eh:150, ph:100, cap:false, diff:diff||'easy', lock:false, a:'', opts:[], hint:'' };
    
    const pool = encounterPool(c.diff);
    c.m = pool[Math.floor(Math.random()*pool.length)]; 
    
    document.getElementById('e-name').innerText=c.m.n; 
    let img = document.getElementById('e-img'); img.src=c.m.i; img.style.opacity=1; img.classList.remove('shiny');
    
    const tag = c.diff==='div' ? '（除法）' : c.diff==='frac' ? '（分數）' : '';
    if(Math.random() < 0.1) { img.classList.add('shiny'); msg(`閃光嘅${c.m.n}出現咗！${tag}`); } 
    else if(c.m.h) { msg(`傳說精靈 ${c.m.n} 出現咗！${tag}`); }
    else { msg(`野生嘅${c.m.n}出現咗！${tag}`); }
    
    document.getElementById('q-area').innerText = ""; 
    document.getElementById('q-area').className = "q-text";
    document.getElementById('act').innerHTML = "";
    
    uh(); show('s-battle'); timer = setTimeout(turn,1500);
}

function turn(){
    c.lock = false;
    if(c.ph<=0){msg("佩佩倒下咗…"); timer=setTimeout(home,2000); return;}
    
    if(c.eh < 50 && !c.cap){
        c.cap=true;msg("佢好弱！快啲捉住佢！");
        document.getElementById('q-area').innerText = "";
        document.getElementById('act').innerHTML=`<div class="b-btn catch zh-btn" style="grid-column:span 2" onclick="goCatch()">🔴 扔精靈球！</div>`;
    }else{ 
        msg("佩佩出招！"); 
        genQ(); 
    }
}

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function zh(s){return `<span class="zh">${s}</span>`;}
function setQ(html, visual){
    const q=document.getElementById('q-area');
    q.className = visual ? 'q-text q-visual' : 'q-text';
    q.innerHTML = html;
}
function numOpts(ans, extra){
    const keep=String(ans);
    const seen=new Set([keep]);
    const pool=[];
    (extra||[]).forEach(x=>{
        const s=String(x);
        if(!seen.has(s)){ seen.add(s); pool.push(s); }
    });
    let g=0;
    while(pool.length<3 && g++<80){
        let f=Number(ans)+(Math.floor(Math.random()*11)-5);
        if(f===Number(ans) || f<0) continue;
        const s=String(f);
        if(!seen.has(s)){ seen.add(s); pool.push(s); }
    }
    let k=1;
    while(pool.length<3){
        const s=String(Number(ans)+k);
        if(!seen.has(s)){ seen.add(s); pool.push(s); }
        k++;
    }
    return shuffle([keep, ...pool.slice(0,3)]);
}
function strOpts(ans, extras){
    const keep=String(ans);
    const seen=new Set([keep]);
    const pool=[];
    const add=x=>{ const s=String(x); if(!seen.has(s)){ seen.add(s); pool.push(s); } };
    (extras||[]).forEach(add);
    ['1/6','2/5','3/8','1/8','2/3','5','0','7','3'].forEach(add);
    return shuffle([keep, ...pool.slice(0,3)]);
}
function polar(cx,cy,r,deg){
    const a=(deg-90)*Math.PI/180;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}
function pizzaSVG(num,den){
    const r=40,cx=50,cy=50;
    let d='';
    for(let i=0;i<den;i++){
        const a0=(i/den)*360, a1=((i+1)/den)*360;
        const [x0,y0]=polar(cx,cy,r,a0);
        const [x1,y1]=polar(cx,cy,r,a1);
        const large=(a1-a0)>180?1:0;
        const fill=i<num?'#e74c3c':'#fff6d5';
        d+=`<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}" stroke="#222" stroke-width="1.2"/>`;
    }
    return `<svg class="frac-pizza" viewBox="0 0 100 100" aria-hidden="true">${d}<circle cx="50" cy="50" r="40" fill="none" stroke="#000" stroke-width="2.5"/></svg>`;
}
function barHTML(num,den){
    let c='';
    for(let i=0;i<den;i++) c+=`<i class="frac-cell${i<num?' on':''}"></i>`;
    return `<div class="frac-bar" aria-hidden="true">${c}</div>`;
}
function blocksHTML(num,den){
    let c='';
    for(let i=0;i<den;i++) c+=`<i class="frac-block${i<num?' on':''}"></i>`;
    return `<div class="frac-blocks" aria-hidden="true">${c}</div>`;
}
function fracVis(num,den){
    const kind=pick(['pizza','bar','blocks']);
    if(kind==='bar') return barHTML(num,den);
    if(kind==='blocks') return blocksHTML(num,den);
    return pizzaSVG(num,den);
}

function genMulQ(hard){
    let txt, ans, extra;
    if(!hard){
        const n1=ri(0,10), n2=ri(0,10);
        ans=n1*n2;
        txt=`${n1} × ${n2} = ?`;
        extra=[n1+n2, Math.abs(n1-n2), n1*Math.max(0,n2-1), n1*(n2+1)];
    }else{
        let a=ri(0,10), b=ri(0,10), d=ri(0,5), e=ri(0,5);
        let p1=a*b, p2=d*e;
        if(Math.random()>0.5){
            ans=p1+p2; txt=`${a}×${b} + ${d}×${e} = ?`;
        }else{
            if(p1<p2){ [p1,p2]=[p2,p1]; [a,b,d,e]=[d,e,a,b]; }
            ans=p1-p2; txt=`${a}×${b} - ${d}×${e} = ?`;
        }
        extra=[p1,p2,ans+2,Math.abs(ans-2)];
    }
    return {ans:String(ans), opts:numOpts(ans,extra), html:txt, visual:false, hint:`錯喇！答案係 ${ans}`};
}

function factorsOf(n){
    const f=[];
    for(let i=1;i<=n;i++) if(n%i===0) f.push(i);
    return f;
}

function genDivQ(){
    const kind=pick(['exact','remain','factor','divides']);
    if(kind==='exact'){
        const div=ri(2,12);
        let quo=ri(2,12);
        while(div*quo>100) quo--;
        const dividend=div*quo;
        const ans=String(quo);
        return {
            ans, opts:numOpts(quo,[div, dividend, quo+1, quo-1, Math.floor(dividend/Math.max(2,div-1))]),
            html:`${dividend} ÷ ${div} = ?`, visual:false,
            hint:`錯！${div} × ${quo} = ${dividend}，所以 ${dividend} ÷ ${div} = ${quo}`
        };
    }
    if(kind==='remain'){
        const div=ri(2,12);
        let quo=ri(2,8);
        const rem=ri(1,div-1);
        let dividend=div*quo+rem;
        if(dividend>100){ quo=Math.max(2,Math.floor((100-rem)/div)); dividend=div*quo+rem; }
        const ans=String(rem);
        return {
            ans, opts:numOpts(rem,[quo, div, rem+1, Math.max(0,rem-1), dividend%Math.max(2,div-1)]),
            html:zh(`${dividend} ÷ ${div} 嘅餘數 = ？`), visual:false,
            hint:`錯！${div} × ${quo} = ${div*quo}，餘 ${rem}`
        };
    }
    if(kind==='factor'){
        const n=pick([12,16,18,20,24,28,30,36,42,48]);
        const fac=factorsOf(n);
        const proper=fac.filter(f=>f!==1 && f!==n);
        const ans=String(pick(proper.length?proper:fac.filter(f=>f!==1)));
        const extra=[];
        for(let i=2;i<=n && extra.length<6;i++){
            if(!fac.includes(i)) extra.push(String(i));
        }
        if(extra.length<3) extra.push(String(n+1), String(n+2), '9');
        return {
            ans, opts:strOpts(ans, extra),
            html:zh(`邊個係 ${n} 嘅因數？`), visual:false,
            hint:`錯！${ans} × ${n/Number(ans)} = ${n}，所以 ${ans} 係因數`
        };
    }
    const n=pick([12,18,24,30,36,42,48,60]);
    const fac=factorsOf(n).filter(f=>f>=2 && f<=12 && f<n);
    const ans=String(pick(fac.length?fac:[2]));
    const extra=[];
    for(let i=2;i<=12 && extra.length<6;i++){
        if(n%i!==0) extra.push(String(i));
    }
    return {
        ans, opts:strOpts(ans, extra),
        html:zh(`邊個可以整除 ${n}？`), visual:false,
        hint:`錯！${n} ÷ ${ans} = ${n/Number(ans)}（${ans} × ${n/Number(ans)} = ${n}）`
    };
}

function genFracQ(){
    const dens=[2,3,4,5,6,8,10];
    const kind=pick(['visual','addsub','equiv','cmp']);
    if(kind==='visual'){
        const den=pick(dens);
        const num=ri(1,den-1);
        const ans=`${num}/${den}`;
        const extra=[`${Math.max(1,num-1)}/${den}`, `${Math.min(den-1,num+1)}/${den}`, `${num}/${pick(dens.filter(d=>d!==den))}`, `${den}/${num===0?den:num}`].filter(x=>x!==ans);
        if(num!==1) extra.push(`1/${den}`);
        return {
            ans, opts:strOpts(ans, extra),
            html:fracVis(num,den)+zh('陰影係邊個分數？'), visual:true,
            hint:`錯！答案係 ${ans}`
        };
    }
    if(kind==='addsub'){
        const den=pick([4,5,6,8,10]);
        if(Math.random()>0.45){
            const a=ri(1,den-1);
            const b=ri(1,den-a);
            const sum=a+b;
            const ans=sum===den?'1':`${sum}/${den}`;
            const extra=[`${a}/${den}`, `${b}/${den}`, `${Math.max(1,sum-1)}/${den}`, sum===den?`${den}/${den}`:`${sum+1}/${den}`, '1'].filter(x=>x!==ans);
            return {
                ans, opts:strOpts(ans, extra),
                html:`${a}/${den} + ${b}/${den} = ?`, visual:false,
                hint:`錯！分母不變，分子 ${a}+${b}=${sum} → ${ans}`
            };
        }
        const a=ri(2,den);
        const b=ri(1,a-1);
        const diff=a-b;
        const ans=diff===0?'0':`${diff}/${den}`;
        const extra=[`${a}/${den}`, `${b}/${den}`, `${Math.max(1,diff+1)}/${den}`, `${diff}/${Math.max(2,den-1)}`].filter(x=>x!==ans);
        return {
            ans, opts:strOpts(ans, extra),
            html:`${a}/${den} − ${b}/${den} = ?`, visual:false,
            hint:`錯！分母不變，分子 ${a}−${b}=${diff} → ${ans}`
        };
    }
    if(kind==='equiv'){
        const pairs=[[1,2,2,4],[1,2,3,6],[1,2,4,8],[1,2,5,10],[1,3,2,6],[1,4,2,8],[2,4,1,2],[3,6,1,2],[2,6,1,3],[2,8,1,4],[4,8,1,2],[6,8,3,4],[4,6,2,3],[2,10,1,5],[4,10,2,5],[5,10,1,2]];
        const [a,b,c,d]=pick(pairs);
        const ans=`${c}/${d}`;
        const extra=[`${a}/${d}`, `${c}/${b}`, `${a+1}/${b}`, `${c}/${d+1||2}`, '1/1', `${b}/${a}`].filter(x=>x!==ans && x!==`${a}/${b}`);
        return {
            ans, opts:strOpts(ans, extra),
            html:zh(`邊個同 ${a}/${b} 相等？`), visual:false,
            hint:`錯！${a}/${b} = ${ans}`
        };
    }
    const pairs=[[1,2,1,3],[1,2,1,4],[2,3,1,2],[3,4,2,4],[1,4,1,5],[2,5,1,2],[3,8,1,2],[2,3,3,4],[1,6,1,3],[3,5,1,2]];
    const [a,b,c,d]=pick(pairs);
    const left=a/b, right=c/d;
    const bigger=left>right?`${a}/${b}`:`${c}/${d}`;
    const smaller=left>right?`${c}/${d}`:`${a}/${b}`;
    const extra=[smaller,'一樣大', `${Math.min(a,c)}/${Math.max(b,d)}`];
    return {
        ans:bigger, opts:strOpts(bigger, extra),
        html:zh(`邊個大啲？ ${a}/${b} 定 ${c}/${d}？`), visual:false,
        hint:`錯！${bigger} 大過 ${smaller}`
    };
}

function genQ() {
    let q;
    if (c.diff === 'div') q = genDivQ();
    else if (c.diff === 'frac') q = genFracQ();
    else q = genMulQ(c.diff === 'hard');
    c.a = q.ans;
    c.opts = q.opts;
    c.hint = q.hint || `錯喇！答案係 ${q.ans}`;
    setQ(q.html, q.visual);
    document.getElementById('act').innerHTML = q.opts.map((v,i)=>
        `<div class="b-btn${/[\u4e00-\u9fff]/.test(v)?' zh-btn':''}" onclick="atk(${i}, this)">${esc(v)}</div>`
    ).join('');
}

function atk(i, btn){
    if(c.lock) return;
    c.lock = true;
    const v = c.opts[i];

    let qArea = document.getElementById('q-area');
    if(v===c.a){
        btn.classList.add('btn-correct');
        let d=30; c.eh-=d; msg("打中！");
        qArea.classList.add('anim-correct');
        document.querySelector('.pos-p').classList.add('atk');setTimeout(()=>document.querySelector('.pos-p').classList.remove('atk'),300);
        let e=document.getElementById('e-img');e.classList.add('dmg');setTimeout(()=>e.classList.remove('dmg'),400);
        uh(); 
        if(c.eh<=0){msg("對手倒下咗！"); document.getElementById('e-img').style.opacity=0; timer=setTimeout(home,2000);} 
        else { timer=setTimeout(turn,1500); }
    } else {
        btn.classList.add('btn-wrong');
        let d=25; c.ph-=d; 
        msg(c.hint || `錯喇！答案係 ${c.a}`);
        qArea.classList.add('anim-wrong');
        uh();
        if(c.eh>0) timer=setTimeout(turn, 2000);
    }
}

function goCatch(){
    if(c.lock) return;
    c.lock = true;

    let l=document.getElementById('l-ball'), b=document.getElementById('ball'), f=document.getElementById('flash'), cd=document.getElementById('c-display');
    cd.style.display="none"; cd.classList.remove('happy-jump'); b.style.display="block"; b.style.opacity="1"; b.style.transform="scale(1)";
    l.classList.remove('hidden'); b.classList.add('b-throw');
    setTimeout(()=>{ b.classList.remove('b-throw'); b.classList.add('b-open'); f.classList.add('s-flash');
        setTimeout(()=>{ b.classList.remove('b-open'); f.classList.remove('s-flash'); 
            b.style.opacity=1; b.style.transform='scale(1)'; b.classList.add('b-shake');
            setTimeout(()=>{ b.classList.remove('b-shake');
                b.style.display="none"; cd.src=c.m.i; cd.style.display="block"; cd.classList.add('pop-up');
                setTimeout(()=>{ cd.classList.remove('pop-up'); cd.classList.add('happy-jump'); },600);
                
                if(!my.includes(c.m.id)) my.push(c.m.id);
                saveProgress();
                msg(`捉到喇！${c.m.n}！`);
                updateDexCount(); document.getElementById('e-img').style.opacity=0;
                
                timer=setTimeout(()=>{
                    l.classList.add('hidden');
                    if(allCaught()) { show('s-award-12'); }
                    else if (allOrdinaryCaught() && !awarded9 && !c.m.h) { awarded9 = true; saveProgress(); show('s-award-9'); }
                    else { home(); }
                },3000);
            },1500);
        },500);
    },500);
}
function uh(){
    document.getElementById('e-hp').style.width=Math.max(0,c.eh/1.5)+'%'; document.getElementById('p-hp').style.width=Math.max(0,c.ph)+'%';
    document.getElementById('e-hp').style.background=c.eh<50?'#d04848':'#58d058';
}
function rd(){
    let h=''; DB.forEach(d=>{
        let got=my.includes(d.id);
        let clickAction = got ? `onclick="showDetail(${d.id})"` : '';
        h+=`<div class="slot ${got?'got':''}" ${clickAction}><img src="${d.i}" style="width:30px"><br><div class="nm">${got?d.n:'？？？'}</div></div>`
    });
    document.getElementById('d-grid').innerHTML=h;
}
function msg(t){
    const el=document.getElementById('msg');
    if(/[\u4e00-\u9fff]/.test(t)) el.innerHTML=`<span class="zh">${esc(t)}</span>`;
    else el.innerText=t;
}
init();
</script>
